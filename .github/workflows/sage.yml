name: Sage Issue Solver

"on":
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: >-
    ${{
      (github.event.issue.pull_request == null &&
       (github.event.comment.body == '/sage solve' ||
        github.event.comment.body == '/sage fix'))
      && format('sage-{0}-issue-{1}', github.event.repository.id, github.event.issue.number)
      || format('sage-{0}-comment-{1}', github.event.repository.id, github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize Sage request
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/sage solve' ||
       github.event.comment.body == '/sage fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      base-branch: ${{ steps.gate.outputs.base-branch }}
      status-comment-id: ${{ steps.gate.outputs.status-comment-id }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      existing-pr-url: ${{ steps.gate.outputs.existing-pr-url }}
    steps:
      - name: Authorize and deduplicate
        id: gate
        uses: 24aysh/sage/.github/actions/sage-gate@02d5e26a09678f34120eac2f218a26db954e224e # V2 prototype
        with:
          github-token: ${{ github.token }}

  solve:
    name: Solve and publish draft PR
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
      SAGE_RUNTIME: ${{ vars.SAGE_RUNTIME || 'v2-prototype' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'sage-v2' }}
      LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
      LANGSMITH_HIDE_INPUTS: ${{ vars.LANGSMITH_HIDE_INPUTS || 'false' }}
      LANGSMITH_HIDE_OUTPUTS: ${{ vars.LANGSMITH_HIDE_OUTPUTS || 'false' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Solve the accepted Issue
        id: solve
        uses: 24aysh/sage/.github/actions/sage-solve@02d5e26a09678f34120eac2f218a26db954e224e # V2 prototype
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          langsmith-api-key: ${{ secrets.LANGSMITH_API_KEY }}
          openai-max-retries: ${{ vars.OPENAI_MAX_RETRIES || '2' }}
          runtime: ${{ vars.SAGE_RUNTIME || 'v2-prototype' }}
          model-profile: constrained-cross-provider
          v2-planner-model: ${{ vars.SAGE_V2_PLANNER_MODEL || 'gemini-3.5-flash' }}
          v2-planner-fallback-model: ${{ vars.SAGE_V2_PLANNER_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          v2-solver-model: ${{ vars.SAGE_V2_SOLVER_MODEL || 'gpt-5.4-mini' }}
          v2-reviewer-model: ${{ vars.SAGE_V2_REVIEWER_MODEL || 'gemini-3.5-flash' }}
          google-model-context-approved: ${{ vars.SAGE_GOOGLE_MODEL_CONTEXT_APPROVED || 'true' }}
          base-sha: ${{ needs.gate.outputs.base-sha }}
          status-comment-id: ${{ needs.gate.outputs.status-comment-id }}

      - name: Upload allowlisted Sage diagnostics
        if: always() && steps.solve.outputs.diagnostics-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sage-issue-${{ needs.gate.outputs.issue-number }}-run-${{ github.run_id }}
          path: |
            ${{ steps.solve.outputs.diagnostics-path }}/metadata.json
            ${{ steps.solve.outputs.diagnostics-path }}/github.json
            ${{ steps.solve.outputs.diagnostics-path }}/agent-final.json
            ${{ steps.solve.outputs.diagnostics-path }}/changed-files.json
            ${{ steps.solve.outputs.diagnostics-path }}/diff.patch
            ${{ steps.solve.outputs.diagnostics-path }}/usage.json
            ${{ steps.solve.outputs.diagnostics-path }}/terminal.json
            ${{ steps.solve.outputs.diagnostics-path }}/verification-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/review.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  finalize:
    name: Finalize interrupted Sage request
    needs: [gate, solve]
    if: >-
      always() &&
      needs.gate.outputs.should-run == 'true' &&
      needs.gate.outputs.status-comment-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Preserve or repair terminal status
        uses: 24aysh/sage/.github/actions/sage-gate@02d5e26a09678f34120eac2f218a26db954e224e # V2 prototype
        with:
          github-token: ${{ github.token }}
          operation: finalize
