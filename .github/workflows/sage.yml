name: Sage Issue Solver

"on":
  issue_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    name: Authorize Sage request
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/sage solve' ||
       github.event.comment.body == '/sage fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      base-branch: ${{ steps.gate.outputs.base-branch }}
      status-comment-id: ${{ steps.gate.outputs.status-comment-id }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      existing-pr-url: ${{ steps.gate.outputs.existing-pr-url }}
    steps:
      - name: Authorize and deduplicate
        id: gate
        uses: 24aysh/sage/.github/actions/sage-gate@583c40bbf1c8be03369d0c691b4db13d6e32603c
        with:
          github-token: ${{ github.token }}

  solve:
    name: Solve and publish draft PR
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: sage-${{ github.event.repository.id }}-solve
      queue: max
      cancel-in-progress: false
    env:
      SAGE_RUNTIME: ${{ vars.SAGE_RUNTIME || 'v2' }}
      LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'false' }}
      LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'sage-v2' }}
      LANGSMITH_WORKSPACE_ID: ${{ vars.LANGSMITH_WORKSPACE_ID }}
      LANGSMITH_HIDE_INPUTS: ${{ vars.LANGSMITH_HIDE_INPUTS || 'false' }}
      LANGSMITH_HIDE_OUTPUTS: ${{ vars.LANGSMITH_HIDE_OUTPUTS || 'false' }}
      SAGE_RESEARCH_ENABLED: ${{ vars.SAGE_RESEARCH_ENABLED || 'true' }}
      SAGE_RESEARCH_TIMEOUT_SECONDS: ${{ vars.SAGE_RESEARCH_TIMEOUT_SECONDS || '15' }}
      SAGE_RESEARCH_MAX_RESULT_CHARS: ${{ vars.SAGE_RESEARCH_MAX_RESULT_CHARS || '12000' }}
      SAGE_RESEARCH_ALLOWED_DOMAINS: ${{ vars.SAGE_RESEARCH_ALLOWED_DOMAINS }}
      SAGE_OFFICIAL_DOCUMENTATION_DOMAINS: ${{ vars.SAGE_OFFICIAL_DOCUMENTATION_DOMAINS }}
      SAGE_MEMORY_ENABLED: ${{ vars.SAGE_MEMORY_ENABLED || 'false' }}
      SAGE_MEMORY_SUMMARIZER_PROVIDER: ${{ vars.SAGE_MEMORY_SUMMARIZER_PROVIDER || 'google' }}
      SAGE_MEMORY_SUMMARIZER_MODEL: ${{ vars.SAGE_MEMORY_SUMMARIZER_MODEL || 'gemini-3.5-flash' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Solve the accepted Issue
        id: solve
        uses: 24aysh/sage/.github/actions/sage-solve@583c40bbf1c8be03369d0c691b4db13d6e32603c
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          langsmith-api-key: ${{ secrets.LANGSMITH_API_KEY }}
          web-search-api-key: ${{ secrets.SAGE_WEB_SEARCH_API_KEY }}
          web-search-provider: ${{ vars.SAGE_WEB_SEARCH_PROVIDER || '' }}
          openai-max-retries: ${{ vars.OPENAI_MAX_RETRIES || '2' }}
          runtime: ${{ vars.SAGE_RUNTIME || 'v2' }}
          model-profile: constrained-cross-provider
          v2-solver-model: ${{ vars.SAGE_V2_SOLVER_MODEL || 'gpt-5.4-mini' }}
          v2-reviewer-model: ${{ vars.SAGE_V2_REVIEWER_MODEL || 'gemini-3.5-flash' }}
          google-model-context-approved: ${{ vars.SAGE_GOOGLE_MODEL_CONTEXT_APPROVED || 'true' }}
          base-sha: ${{ needs.gate.outputs.base-sha }}
          base-branch: ${{ needs.gate.outputs.base-branch }}
          status-comment-id: ${{ needs.gate.outputs.status-comment-id }}
          memory-enabled: ${{ vars.SAGE_MEMORY_ENABLED || 'false' }}
          memory-database-url: ${{ secrets.SAGE_MEMORY_DATABASE_URL }}
          memory-summarizer-provider: ${{ vars.SAGE_MEMORY_SUMMARIZER_PROVIDER || 'google' }}
          memory-summarizer-model: ${{ vars.SAGE_MEMORY_SUMMARIZER_MODEL || 'gemini-3.5-flash' }}

      - name: Upload allowlisted Sage diagnostics
        if: always() && steps.solve.outputs.diagnostics-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sage-issue-${{ needs.gate.outputs.issue-number }}-run-${{ github.run_id }}
          path: |
            ${{ steps.solve.outputs.diagnostics-path }}/metadata.json
            ${{ steps.solve.outputs.diagnostics-path }}/github.json
            ${{ steps.solve.outputs.diagnostics-path }}/agent-final.json
            ${{ steps.solve.outputs.diagnostics-path }}/research-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/memory-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/solver-plan.json
            ${{ steps.solve.outputs.diagnostics-path }}/solver-final.json
            ${{ steps.solve.outputs.diagnostics-path }}/changed-files.json
            ${{ steps.solve.outputs.diagnostics-path }}/diff.patch
            ${{ steps.solve.outputs.diagnostics-path }}/usage.json
            ${{ steps.solve.outputs.diagnostics-path }}/terminal.json
            ${{ steps.solve.outputs.diagnostics-path }}/verification-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/review.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  finalize:
    name: Finalize interrupted Sage request
    needs: [gate, solve]
    if: >-
      always() &&
      needs.gate.outputs.should-run == 'true' &&
      needs.gate.outputs.status-comment-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Preserve or repair terminal status
        uses: 24aysh/sage/.github/actions/sage-gate@583c40bbf1c8be03369d0c691b4db13d6e32603c
        with:
          github-token: ${{ github.token }}
          operation: finalize
