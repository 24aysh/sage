name: Sage Issue Solver

"on":
  issue_comment:
    types: [created]

permissions: {}

# Repository-owned, non-secret Sage configuration. Keep credential values in
# GitHub Secrets and edit these strings to tune the installed workflow.
env:
  SAGE_LEGION_EMBEDDINGS_ENABLED: "true"
  SAGE_LEGION_INITIAL_CONTEXT_CHARS: "4000"
  SAGE_LEGION_EMBEDDING_MODEL: "gemini-embedding-2"
  SAGE_LEGION_EMBEDDING_DIMENSIONS: "3072"
  SAGE_LEGION_EMBEDDING_MAX_NODES: "2000"
  SAGE_LEGION_EMBEDDING_DEADLINE_SECONDS: "300"
  SAGE_LEGION_EMBEDDING_TIMEOUT_SECONDS: "30"
  SAGE_LEGION_EMBEDDING_CONCURRENCY: "1"
  SAGE_LEGION_EMBEDDING_RETRIES: "1"
  SAGE_LEGION_EMBEDDING_MIN_SIMILARITY: "0.45"
  SAGE_LEGION_QDRANT_PATH: ""
  OPENAI_MAX_RETRIES: "2"
  SAGE_GOOGLE_MODEL_CONTEXT_APPROVED: "true"
  SOLVER_MODEL: "gpt-5.4-mini"
  REVIEWER_MODEL: "gemini-3.5-flash"
  SAGE_RESEARCH_ENABLED: "true"
  SAGE_WEB_SEARCH_PROVIDER: ""
  SAGE_RESEARCH_TIMEOUT_SECONDS: "15"
  SAGE_RESEARCH_MAX_RESULT_CHARS: "12000"
  SAGE_RESEARCH_ALLOWED_DOMAINS: ""
  SAGE_OFFICIAL_DOCUMENTATION_DOMAINS: ""
  SAGE_VERIFICATION_COMMANDS_JSON: "[]"
  SAGE_VERIFICATION_PREFLIGHT: "false"
  SAGE_VERIFICATION_PREFLIGHT_DEPENDENCIES_JSON: "[]"
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: "sage-v2"
  LANGSMITH_WORKSPACE_ID: ""
  LANGSMITH_HIDE_INPUTS: "false"
  LANGSMITH_HIDE_OUTPUTS: "false"
  SAGE_MAX_TURNS: "30"
  SAGE_RUNS_DIR: ".sage/runs"
  SAGE_SANDBOX_IMAGE: "sage-sandbox:v2"
  SAGE_COMMAND_TIMEOUT_SECONDS: "60"
  SAGE_MAX_TOOL_OUTPUT_CHARS: "12000"
  SAGE_GITHUB_API_TIMEOUT_SECONDS: "30"
  SAGE_GITHUB_MAX_COMMENTS: "20"
  SAGE_GITHUB_MAX_COMMENT_PAGES: "5"
  SAGE_GITHUB_MAX_CONTEXT_CHARS: "40000"

concurrency:
  group: >-
    ${{
      (github.event.issue.pull_request == null &&
       (github.event.comment.body == '/sage solve' ||
        github.event.comment.body == '/sage fix'))
      && format('sage-{0}-issue-{1}', github.event.repository.id, github.event.issue.number)
      || format('sage-{0}-comment-{1}', github.event.repository.id, github.event.comment.id)
    }}
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize Sage request
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/sage solve' ||
       github.event.comment.body == '/sage fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      should-run: ${{ steps.gate.outputs.should-run }}
      base-sha: ${{ steps.gate.outputs.base-sha }}
      base-branch: ${{ steps.gate.outputs.base-branch }}
      status-comment-id: ${{ steps.gate.outputs.status-comment-id }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
      existing-pr-url: ${{ steps.gate.outputs.existing-pr-url }}
    steps:
      - name: Authorize and deduplicate
        id: gate
        uses: 24aysh/sage/.github/actions/sage-gate@52cc9a940b573b3721d3135ca4d3a6256f0e9517
        with:
          github-token: ${{ github.token }}

  solve:
    name: Solve and publish draft PR
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Solve the accepted Issue
        id: solve
        uses: 24aysh/sage/.github/actions/sage-solve@52cc9a940b573b3721d3135ca4d3a6256f0e9517
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          langsmith-api-key: ${{ secrets.LANGSMITH_API_KEY }}
          web-search-api-key: ${{ secrets.SAGE_WEB_SEARCH_API_KEY }}
          legion-qdrant-url: ${{ secrets.SAGE_LEGION_QDRANT_URL }}
          legion-qdrant-api-key: ${{ secrets.SAGE_LEGION_QDRANT_API_KEY }}
          base-sha: ${{ needs.gate.outputs.base-sha }}
          status-comment-id: ${{ needs.gate.outputs.status-comment-id }}

      - name: Upload allowlisted Sage diagnostics
        if: always() && steps.solve.outputs.diagnostics-path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sage-issue-${{ needs.gate.outputs.issue-number }}-run-${{ github.run_id }}
          path: |
            ${{ steps.solve.outputs.diagnostics-path }}/metadata.json
            ${{ steps.solve.outputs.diagnostics-path }}/github.json
            ${{ steps.solve.outputs.diagnostics-path }}/agent-final.json
            ${{ steps.solve.outputs.diagnostics-path }}/research-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/solver-plan.json
            ${{ steps.solve.outputs.diagnostics-path }}/solver-final.json
            ${{ steps.solve.outputs.diagnostics-path }}/changed-files.json
            ${{ steps.solve.outputs.diagnostics-path }}/diff.patch
            ${{ steps.solve.outputs.diagnostics-path }}/usage.json
            ${{ steps.solve.outputs.diagnostics-path }}/legion-memory.json
            ${{ steps.solve.outputs.diagnostics-path }}/terminal.json
            ${{ steps.solve.outputs.diagnostics-path }}/verification-summary.json
            ${{ steps.solve.outputs.diagnostics-path }}/review.json
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: false

  finalize:
    name: Finalize interrupted Sage request
    needs: [gate, solve]
    if: >-
      always() &&
      needs.gate.outputs.should-run == 'true' &&
      needs.gate.outputs.status-comment-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Preserve or repair terminal status
        uses: 24aysh/sage/.github/actions/sage-gate@52cc9a940b573b3721d3135ca4d3a6256f0e9517
        with:
          github-token: ${{ github.token }}
          operation: finalize
