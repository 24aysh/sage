services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sage_memory_test
      POSTGRES_USER: sage_test
      POSTGRES_PASSWORD: sage_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage_test -d sage_memory_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - sage-memory-postgres:/var/lib/postgresql/data

volumes:
  sage-memory-postgres:
