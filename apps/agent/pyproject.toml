[project]
name = "sage"
version = "0.1.0"
description = "A local, execution-grounded GitHub issue solver"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "pydantic>=2.13.4",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyyaml>=6.0.3,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
