[project]
name = "sage"
version = "1.0.0"
description = "A GitHub-native, execution-grounded issue-to-draft-PR agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "openai>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic>=2.13.4",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "memory_postgres: requires SAGE_MEMORY_TEST_DATABASE_URL for a disposable database",
]
filterwarnings = [
    'ignore:.*_UnionGenericAlias.*Python 3\.17.*:DeprecationWarning:google\.genai\.types',
]
