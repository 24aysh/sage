[project]
name = "sage"
version = "2.0.0"
description = "A GitHub-native, execution-grounded issue-to-draft-PR agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "networkx>=3.2,<4",
    "openai>=3.1,<4",
    "pydantic>=2.13.4",
    "tree-sitter>=0.23,<1",
    "tree-sitter-language-pack>=0.3,<1",
]

[project.scripts]
sage = "sage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["code-review-graph"]
filterwarnings = [
    'ignore:.*_UnionGenericAlias.*Python 3\.17.*:DeprecationWarning:google\.genai\.types',
]
